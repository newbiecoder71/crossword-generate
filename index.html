<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Always-dark launch assets to avoid white startup flash on mobile -->
    <link rel="icon" type="image/x-icon" href="/favicon-dark.ico">
    <link rel="icon" type="image/png" href="/icon-dark-512.png" sizes="512x512">
    <link rel="icon" type="image/png" href="/icon-dark-256.png" sizes="256x256">
    <link rel="apple-touch-icon" href="/icon-dark-512.png">
    <meta name="theme-color" content="#001F3F" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="color-scheme" content="dark" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
      document.documentElement.classList.add("boot-dark");
    </script>
    <style>
      html.boot-dark,
      html.boot-dark body,
      html.boot-dark #root {
        background: #001f3f;
      }

      html,
      body,
      #root {
        margin: 0;
        width: 100%;
        height: 100%;
        background: #001f3f;
      }
    </style>
    <title>Crossword Generate+</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
